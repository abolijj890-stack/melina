<!DOCTYPE html>
<html lang="fa">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تولد ملینا ❤️</title>

    <style>

        body {
            background: #ffe6f0;
            text-align: center;
            font-family: sans-serif;
        }

        h1 {
            color: #e91e63;
            font-size: 35px;
        }

        h2 {
            color: #ad1457;
        }

        p {
            color: #444;
            font-size: 18px;
            line-height: 1.8;
        }

        .card {
            background: white;
            width: 85%;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .heart {
            position: fixed;
            bottom: -50px;
            font-size: 25px;
            animation: float 5s linear infinite;
        }

        @keyframes float {

            0% {
                transform: translateY(0);
                opacity: 1;
            }

            100% {
                transform: translateY(-100vh);
                opacity: 0;
            }

        }

        .falling-heart {
            position: fixed;
            top: -50px;
            font-size: 30px;
            animation: fall 4s linear forwards;
            z-index: 999;
            pointer-events: none;
        }

        @keyframes fall {

            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }

        }

        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 20px;
        }

        button:active {
            transform: scale(0.95);
        }

        #audioBox {
            display: none;
            margin-top: 25px;
        }

    </style>

</head>

<body>

    <div class="heart">❤️</div>
    <div class="heart">💗</div>
    <div class="heart">💕</div>
    <div class="heart">💖</div>

    <div class="card">

        <h1>تولدت مبارک ملینا ❤️</h1>

        <h2>تو قشنگ ترین اتفاق زندگی منی</h2>

        <p>
            امروز فقط یک روز معمولی نیست؛
            روزیه که بهترین آدم زندگیم به دنیا اومد.
        </p>

        <button onclick="surprise()">
           کلیک کن یه سورپرایز برات دارم ❤️
        </button>

        <div id="audioBox">

            <p>عاشقتم بچه</p>

            <audio controls src="melina_015318048.mp3"></audio>

        </div>

    </div>


    <script>

        function surprise() {

            // نمایش ویس
            document.getElementById("audioBox").style.display = "block";

            // ریختن قلب‌ها
            for (let i = 0; i < 60; i++) {

                let heart = document.createElement("div");

                heart.innerText = "❤️";

                heart.className = "falling-heart";

                heart.style.left = Math.random() * 100 + "vw";

                heart.style.fontSize =
                    (20 + Math.random() * 25) + "px";

                heart.style.animationDuration =
                    (3 + Math.random() * 3) + "s";

                heart.style.animationDelay =
                    Math.random() * 2 + "s";

                document.body.appendChild(heart);

                setTimeout(function() {
                    heart.remove();
                }, 7000);

            }

        }

    </script>

</body>

</html>
